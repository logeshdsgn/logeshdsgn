name: Generate Gitartwork
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jasineri/gitartwork@v1
        with:
          user_name: logeshdsgn
          text: LOGESHDSGN
      - uses: jasineri/simple-push-action@v1